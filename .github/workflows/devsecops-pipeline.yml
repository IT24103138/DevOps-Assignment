name: DevSecOps Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test --if-present
        continue-on-error: true

  gate-sast:
    name: "Gate 1 — SAST (Semgrep)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install semgrep
      - run: |
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --config p/owasp-top-ten \
            --error \
            --severity ERROR

  gate-dependency-scan:
    name: "Gate 2 — Dependency Scan (npm audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Audit backend dependencies
        run: npm audit --audit-level=high
      - name: Audit frontend dependencies
        run: cd frontend && npm audit --audit-level=high

  gate-secret-scan:
    name: "Gate 3 — Secret Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - run: gitleaks detect --source . --verbose --redact

  gate-container-scan:
    name: "Gate 4 — Container Scan (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t juice-shop:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "juice-shop:${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  optional-dast:
    name: "Optional — DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: gate-container-scan
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t juice-shop:${{ github.sha }} .
      - run: |
          docker run -d --name juice-shop -p 3000:3000 juice-shop:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 2
          done
      - uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          cmd_options: "-a"

  pipeline-result:
    name: All Mandatory Gates Passed
    runs-on: ubuntu-latest
    needs: [build-and-test, gate-sast, gate-dependency-scan, gate-secret-scan, gate-container-scan]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.gate-sast.result }}" != "success" ] || \
             [ "${{ needs.gate-dependency-scan.result }}" != "success" ] || \
             [ "${{ needs.gate-secret-scan.result }}" != "success" ] || \
             [ "${{ needs.gate-container-scan.result }}" != "success" ]; then
            echo "One or more mandatory security gates failed — build is NOT releasable."
            exit 1
          fi
          echo "All mandatory gates passed — build is releasable."
